<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตามล่าหาที่เรียน (University Quest)</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2622;--mut:#6f675e;--card:#fff;--bd:#e4ddd2;--ac:#d9622b;--ac2:#fbe6da;--ok:#2f7d5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--fg:#f1ebe3;--mut:#a79d90;--card:#262320;--bd:#3a352f;--ac:#f08a57;--ac2:#3a2a20;--ok:#6cc79d}}
:root[data-theme="dark"]{--bg:#1c1a18;--fg:#f1ebe3;--mut:#a79d90;--card:#262320;--bd:#3a352f;--ac:#f08a57;--ac2:#3a2a20;--ok:#6cc79d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.65 "Noto Sans Thai","Sarabun",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.25rem;margin:1.2em 0 .4em}h3{font-size:1.05rem;margin:.8em 0 .3em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover,.opt.sel{border-color:var(--ac);background:var(--ac2)}
.opt.unsure{color:var(--mut);border-style:dashed}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.btn.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;margin:4px 0 10px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}.row span{width:110px;font-size:.9rem}.row .bar{flex:1;margin:0}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 12px;margin:3px 4px 3px 0;font-size:.9rem}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{border:1px solid var(--bd);padding:6px;text-align:center}td:first-child{text-align:left}td select,td input{margin:0;padding:5px}
a{color:var(--ac)}ul{padding-left:1.2em}
.note{border-left:4px solid var(--ok);padding:8px 12px;background:var(--ac2);border-radius:0 10px 10px 0;font-size:.92rem}
</style>
</head>
<body>
<main id="app"></main>

if(!t){h='<h2>⭐ Idol Battle</h2><div class="card"><p>ใส่บุคคลที่คุณชื่นชม 4–8 คน (อย่างน้อย 2 คน) จะเป็นนักร้อง นักวิทยาศาสตร์ ครู ผู้ประกอบการ หรือคนในชีวิตจริงก็ได้ ใช้ชื่อเล่นหรือตำแหน่งแทนชื่อจริงของคนใกล้ตัวได้</p>'+d.names.map(function(x,i){return '<input type="text" placeholder="คนที่ '+(i+1)+'" data-a="inm" data-i="'+i+'" value="'+esc(x)+'">'}).join("")+(d.err?'<p class="mut">'+esc(d.err)+'</p>':'')+'<button class="btn" data-a="ids">เริ่มแข่ง</button><p class="mut">เกมนี้ไม่ได้จัดอันดับคุณค่าของคน เป็นเพียงการดูว่าคุณชื่นชมอะไร</p></div>'}
else if(!t.done){var a=t.L[t.i],b=t.L[t.i+1],n=t.hist.length;h='<div class="mut">คู่ที่ '+(n+1)+' / '+(t.n-1)+' · '+rl(t.L.length)+'</div><div class="bar"><i style="width:'+Math.round(n/(t.n-1)*100)+'%"></i></div><h2>คุณชื่นชมใครมากกว่า?</h2><button class="opt" data-a="idp" data-v="0"><b>A</b> '+esc(a)+'</button><button class="opt" data-a="idp" data-v="1"><b>B</b> '+esc(b)+'</button>'}
else{h='<h2>🏆 ผล Idol Battle</h2><div class="card"><p><b>Champion:</b> '+esc(t.champ)+(t.runner?'<br><b>Runner-up:</b> '+esc(t.runner):'')+'</p></div><div class="card"><h3>ประวัติการเลือก</h3><ul>'+t.hist.map(function(x){return '<li>'+rl(x.rd)+': '+esc(x.a)+' vs '+esc(x.b)+' → <b>'+esc(x.w)+'</b></li>'}).join("")+'</ul></div><div class="card"><h3>Reflection</h3><p>คุณชื่นชม '+esc(t.champ)+' ในเรื่องอะไร? (เลือกได้ไม่เกิน 3)</p>'+QUAL.map(function(q,i){return '<span class="tag" style="cursor:pointer;'+(d.q.indexOf(i)>=0?'font-weight:700;outline:2px solid var(--ac)':'')+'" data-a="idq" data-v="'+i+'">'+q+'</span>'}).join("")+'<p>เล่าเพิ่ม: ทำไมถึงชื่นชม?</p><textarea rows="2" data-a="set" data-k="idol.why">'+esc(d.why||"")+'</textarea><p>คุณอยากเรียนรู้อะไรจากเขา?</p><textarea rows="2" data-a="set" data-k="idol.learn">'+esc(d.learn||"")+'</textarea></div><button class="btn ghost" data-a="idr">แข่งใหม่</button><button class="btn" data-a="go" data-v="prof">ดู Student Profile →</button>'}

function v_prof(){$('<h2>📋 Student Profile</h2><div class="note">ข้อมูลทั้งหมดเป็นสมมติฐานเบื้องต้นเพื่อการสำรวจ คุณเป็นผู้ตัดสินใจเองเสมอ</div><div class="card"><textarea id="sm" rows="14" readonly>'+esc(profText())+'</textarea><button class="btn" data-a="copy">คัดลอกสรุป</button><p class="mut">นำไปวางใน ChatGPT, Claude หรือ AI อื่น หรือนำไปปรึกษาครูแนะแนวได้ ควรตรวจสอบข้อมูลที่ AI ตอบกับเว็บทางการเสมอ</p></div><button class="btn" data-a="go" data-v="chat">💬 คุยกับโค้ช AI</button><button class="btn ghost" data-a="go" data-v="find">ตามล่าหลักสูตร →</button>')}
var H2={q:function(){var k=0;while(k<Q.length&&typeof S.ans[k]=="number")k++;S.i=k>=Q.length?0:k;go("quiz")},clear:function(){if(!S.cc){S.cc=1;draw();return}fresh();S.grade="";try{localStorage.removeItem("uq1")}catch(e){}go("intro")},
set:function(e){var p=e.dataset.k.split(".");S[p[0]][p[1]]=e.value;save()},
mis:function(){S.mi.t=tS([0,1,2,3,4,5,6,7]);save();draw()},mip:function(e){tPick(S.mi.t,+e.dataset.v);save();draw()},mir:function(){S.mi={top3:[],ref:"",ev:""};save();draw()},
mit:function(e){var v=+e.dataset.v,a=S.mi.top3,k=a.indexOf(v);if(k>=0)a.splice(k,1);else if(a.length<3)a.push(v);save();draw()},
inm:function(e){S.idol.names[+e.dataset.i]=e.value;save()},
ids:function(){var s=[];S.idol.names.forEach(function(x){x=x.trim();if(x&&s.indexOf(x)<0)s.push(x)});if(s.length<2){S.idol.err="ใส่อย่างน้อย 2 ชื่อที่ไม่ซ้ำกัน";draw();return}S.idol.err="";S.idol.t=tS(s);save();draw()},
idp:function(e){tPick(S.idol.t,+e.dataset.v);save();draw()},idr:function(){S.idol.t=null;S.idol.q=[];S.idol.why="";S.idol.learn="";save();draw()},
idq:function(e){var v=+e.dataset.v,a=S.idol.q,k=a.indexOf(v);if(k>=0)a.splice(k,1);else if(a.length<3)a.push(v);save();draw()}};
Object.keys(H2).forEach(function(k){H[k]=H2[k]});
load();
draw();
