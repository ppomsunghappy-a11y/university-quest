<!DOCTYPE html>

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--fg:#f1ebe3;--mut:#a79d90;--card:#262320;--bd:#3a352f;--ac:#f08a57;--ac2:#3a2a20;--ok:#6cc79d}}
:root[data-theme="dark"]{--bg:#1c1a18;--fg:#f1ebe3;--mut:#a79d90;--card:#262320;--bd:#3a352f;--ac:#f08a57;--ac2:#3a2a20;--ok:#6cc79d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.65 "Noto Sans Thai","Sarabun",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.25rem;margin:1.2em 0 .4em}h3{font-size:1.05rem;margin:.8em 0 .3em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover,.opt.sel{border-color:var(--ac);background:var(--ac2)}
.opt.unsure{color:var(--mut);border-style:dashed}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.btn.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;margin:4px 0 10px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}.row span{width:110px;font-size:.9rem}.row .bar{flex:1;margin:0}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 12px;margin:3px 4px 3px 0;font-size:.9rem}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{border:1px solid var(--bd);padding:6px;text-align:center}td:first-child{text-align:left}td select,td input{margin:0;padding:5px}
a{color:var(--ac)}ul{padding-left:1.2em}
.note{border-left:4px solid var(--ok);padding:8px 12px;background:var(--ac2);border-radius:0 10px 10px 0;font-size:.92rem}
</style>
</head>

function v_intro(){$('<h1>🗺️ ตามล่าหาที่เรียน</h1><p class="mut">University Quest — ค้นพบตัวเอง เปิดแผนที่อนาคต</p><div class="card"><p>เกมนี้ไม่ได้บอกว่าคุณต้องเป็นใคร แต่ช่วยให้เห็นว่ามีทางเลือกอะไรบ้าง และเริ่มเดินสำรวจอย่างไร</p><ul><li>ตอบ 15 ข้อ ใช้เวลา 3–5 นาที ทุกข้อมี “ยังไม่แน่ใจ”</li><li>เติมผล MBTI / VIA / กงล้อสี่ทิศได้ ถ้ามี (ไม่บังคับ)</li><li>ได้แผนที่ตัวตน ตารางเปรียบเทียบ และแผน 30 วัน</li></ul><p class="mut">ผลลัพธ์เป็นสมมติฐานเบื้องต้นสำหรับการสำรวจ ไม่ใช่การวินิจฉัยหรือคำตัดสินอนาคต ไม่มีคำตอบถูกหรือผิด ข้อมูลที่ตอบอยู่บนเครื่องคุณเท่านั้น</p></div><h3>ตอนนี้คุณอยู่ชั้นไหน?</h3>'+["ม.4","ม.5","ม.6","ยังไม่แน่ใจ"].map(function(g){return '<button class="opt" data-a="start" data-v="'+g+'">'+g+'</button>'}).join(""))}
